name: CI

on:
  push:
    branches: [main, "feature/*", "feat/*"]
  pull_request:
    branches: [main, "feat/*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, 2026-04-25
        env:
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: init.defaultBranch
          GIT_CONFIG_VALUE_0: main
          GIT_CONFIG_KEY_1: advice.defaultBranchName
          GIT_CONFIG_VALUE_1: "false"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2, 2026-04-25
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          SOPHIA_SKIP_CHROME_MCP_SETUP: "1"
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bunx biome ci .

      - name: Type check
        run: bun run typecheck

      - name: Test with Coverage
        run: |
          # Coverage is fail-closed and runs every test in process-isolated batches. This
          # avoids Bun's process-global mock pollution and bounds coverage memory usage.
          bun run scripts/run-coverage.ts

      - name: Build
        run: bun run test:all
